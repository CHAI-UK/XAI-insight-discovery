name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the pinned environment
        run: pip install -r requirements.txt
      - name: Run the tests
        env:
          MPLBACKEND: Agg
        run: pytest test_recommender.py -q
